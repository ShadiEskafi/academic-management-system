    <!-- Verified Google Fonts for the Design System -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <!-- Schema.org Structured Data: Defines as Academic Web Application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "مِحْوَر - Mihwar OS",
        "url": "https://www.mih-war.tech",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "description": "نظام ويب لإدارة الحياة الجامعية، تنظيم المواد الأكاديمية، متابعة تقدم شجرة الموضوعات، توزيع أوزان الامتحانات، وتوزيع أوقات الدراسة أسبوعياً.",
        "inLanguage": "ar",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Theme Initialization: Prevents Flash of Unstyled Theme -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

      </div>

    <div id="app"></div>
